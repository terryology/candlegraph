<div class="sc-grid" style="margin:28px 0;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden;">
  <div class="sc-cell">
    <span class="lab">MSRP</span>
    <span class="v num">${{ .Get "price" }}</span>
  </div>
  <div class="sc-cell">
    <span class="lab">Burn Time</span>
    <span class="v num">{{ .Get "burn" }}h</span>
  </div>
  <div class="sc-cell">
    <span class="lab">Efficiency</span>
    <span class="v num">{{ .Get "efficiency" }} min/$</span>
  </div>
  <div class="sc-cell">
    <span class="lab">Cost/Hour</span>
    <span class="v num">${{ .Get "cost_hour" }}</span>
  </div>
</div>
