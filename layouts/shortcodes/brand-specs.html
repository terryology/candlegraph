<div class="sc-panel" style="margin:28px 0;">
  <div class="sc-prod">{{ .Get "brand" | upper }} PERFORMANCE</div>
  <div class="sc-hero">
    <span class="big num">{{ .Get "sav" }}</span>
    <div class="herometa">
      <span class="lab">SAV Index</span>
    </div>
  </div>
  <div class="sc-grid">
    <div class="sc-cell">
      <span class="lab">PAE Index</span>
      <span class="v num">{{ .Get "pae" }}</span>
    </div>
    <div class="sc-cell">
      <span class="lab">Tier</span>
      <span class="v"><span class="tier {{ .Get "tier" | lower }}">{{ .Get "tier" }}</span></span>
    </div>
  </div>
  <div class="sc-foot">
    <span class="dotmark"></span>
    <a href="/methodology/" style="color:var(--muted);font-size:11.5px;">How these indexes are calculated →</a>
  </div>
</div>
