<div class="vault-audit-card">
  <div class="vac-header">
    <span class="vac-id num">Brand Audit · {{ .Get "brand" }}</span>
  </div>
  <div class="sc-grid vac-grid" style="grid-template-columns: repeat(3, 1fr);">
    <div class="sc-cell">
      <span class="lab">Candles Burned</span>
      <span class="v num">{{ .Get "candles" }}</span>
    </div>
    <div class="sc-cell">
      <span class="lab">Total Burn Hours</span>
      <span class="v num">{{ .Get "hours" }}h</span>
    </div>
    <div class="sc-cell">
      <span class="lab">Index Confidence</span>
      <span class="v">{{ .Get "confidence" }}</span>
    </div>
  </div>
</div>
