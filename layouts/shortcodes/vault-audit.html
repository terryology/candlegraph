<div style="border-top:1px solid var(--line);margin-top:40px;padding-top:20px;">
  <div style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:14px;">
    <strong style="color:var(--ink);">Data Provenance:</strong> {{ .Get "brand" }} / {{ .Get "id" }}
  </div>
  <div class="sc-grid" style="border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden;margin-bottom:12px;">
    <div class="sc-cell">
      <span class="lab">Candles Burned</span>
      <span class="v num">{{ .Get "candles" }}</span>
    </div>
    <div class="sc-cell">
      <span class="lab">Total Burn Hours</span>
      <span class="v num">{{ .Get "hours" }}h</span>
    </div>
    <div class="sc-cell">
      <span class="lab">Index Confidence</span>
      <span class="v">{{ .Get "confidence" }}</span>
    </div>
  </div>
  <div style="font-size:11.5px;color:var(--muted);font-style:italic;">
    This audit was generated by the Candlegraph Engine v2.8.
  </div>
</div>
