{{ define "main" }}
<div class="content">
  <div class="archive-page">
    {{ range (where .Site.RegularPages "Section" "in" (slice "candles" "journal")).GroupByDate "2006" }}
    <div class="archive-year">
      <h2 class="archive-year-label">{{ .Key }}</h2>
      <div class="archive-list">
        {{ range .Pages }}
        <a href="{{ .RelPermalink }}" class="archive-row">
          <span class="archive-row-title">{{ .Title }}</span>
          <span class="archive-row-date num">{{ .Date.Format "Jan 2, 2006" }}</span>
        </a>
        {{ end }}
      </div>
    </div>
    {{ end }}
  </div>
</div>
{{ end }}
